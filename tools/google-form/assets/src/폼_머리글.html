<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 폼 머리글 1600×400 (2026-10-28 재디자인, frontend-design 적용규칙). 과감함 = 큰 제목 한 줄. 카드·아이콘·격자 없음. 흰 로고 원본은 어두운 배경에만. -->
<style>
@font-face{font-family:P;src:url(../../../../.claude/skills/aeo-blog/assets/fonts/Pretendard-SemiBold.otf);font-weight:600}
@font-face{font-family:P;src:url(../../../../.claude/skills/aeo-blog/assets/fonts/Pretendard-ExtraBold.otf);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff}
.canvas{width:1600px;height:400px;position:relative;overflow:hidden;font-family:P;color:#fff;background:#1E2A78;word-break:keep-all}
.in{position:absolute;left:96px;right:96px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:18px;font-size:26px;font-weight:600;color:rgba(255,255,255,.8)}
.brand img{height:40px;width:auto;display:block}
h1{margin-top:30px;font-size:92px;font-weight:800;letter-spacing:-3px;line-height:1.05}
.sub{margin-top:22px;font-size:30px;font-weight:600;color:rgba(255,255,255,.85);letter-spacing:-.4px}
.bar{position:absolute;right:96px;top:0;bottom:0;width:18px;background:#FF5A36}
</style></head><body>
<div class="canvas">
  <i class="bar"></i>
  <div class="in">
    <div class="brand"><img src="logo/SBS아카데미게임학원_White.png" alt="SBS아카데미게임학원"><span>대전점</span></div>
    <h1>상담 신청, 1~2분이면 돼요.</h1>
    <p class="sub">입시(게임학과·웹툰학과)와 취업(국비 과정) 모두 이 신청서 하나로 시작해요.</p>
  </div>
</div>
</body></html>
