<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>

<body><div class="canvas" style="width:1080px;height:1350px"><div class="in"><div class="top"><span><b>입시</b>&nbsp; 게임학과, 갈래는 셋</span><span>3/6</span></div>
<h1 style="margin-top:48px;font-size:88px">같은 이름인데<br>다른 과예요.</h1>

<div style="margin-top:40px;padding-left:28px;border-left:6px solid rgba(30,42,120,.18)">
<div style="font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.2">홍익대(세종) 게임학부</div>
<p class="body" style="margin-top:10px">한 학부 안에서 게임소프트웨어전공은 공학계,<br>게임그래픽디자인전공은 미술계로 따로 뽑아요.</p></div>

<div style="margin-top:40px;padding-left:28px;border-left:6px solid rgba(30,42,120,.18)">
<div style="font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.2">공주대 게임디자인학과</div>
<p class="body" style="margin-top:10px">이름에 '디자인'이 있지만<br>기획·그래픽·프로그래밍을 같이 배워요.</p></div>

<div style="margin-top:40px;padding-left:28px;border-left:6px solid rgba(30,42,120,.18)">
<div style="font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.2">목원대</div>
<p class="body" style="margin-top:10px">코드 중심의 게임소프트웨어공학과와<br>그림 실기로 뽑는 게임콘텐츠학과가 따로 있어요.</p></div>
<p class="lead" style="margin-top:auto;padding-bottom:40px">원서 전에 모집요강의 <b style="color:#FF5A36">계열 표기</b>와<br>학과 교과목을 꼭 같이 봐야 해요.</p>
