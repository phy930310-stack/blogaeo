<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(../../../.claude/skills/aeo-blog/assets/fonts/Pretendard-Regular.otf);font-weight:400}

*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff}
.canvas{position:relative;overflow:hidden;font-family:P;word-break:keep-all}

.canvas{background:#F4F6FB;color:#1E2A78}
.in{position:absolute;left:96px;right:96px;top:96px;bottom:96px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:30px;font-weight:600;color:#7A82B4}
.top b{color:#1E2A78;font-weight:700}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.foot img{height:34px;display:block}
.foot span{font-size:28px;color:#7A82B4;font-weight:600}
.lead{font-size:40px;line-height:1.45;font-weight:600;letter-spacing:-.8px}
.body{font-size:36px;line-height:1.5;font-weight:500;letter-spacing:-.6px;color:#1E2A78}
.body p+p{margin-top:22px}
.small{font-size:27px;line-height:1.5;color:#7A82B4;font-weight:500}

<body><div class="canvas" style="width:1080px;height:1350px"><div class="in"><div class="top"><span><b>진로</b>&nbsp; 일러스트 학원, 목적부터</span><span>3/6</span></div>
<h1 style="margin-top:48px;font-size:88px">학원은 네 종류로<br>갈려요.</h1>

<div style="margin-top:30px;display:flex;gap:30px;align-items:baseline">
<div style="flex:none;width:300px;font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1.1;color:#1E2A78">프로그램<br>교육</div>
<p class="body" style="font-weight:600">일러스트레이터·포토샵 사용법<br>디자인 실무와 자격증이 목적이에요</p></div>

<div style="margin-top:30px;display:flex;gap:30px;align-items:baseline">
<div style="flex:none;width:300px;font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1.1;color:#1E2A78">취미<br>드로잉</div>
<p class="body" style="font-weight:600">주 1~2회 가볍게 그려요<br>시간대와 거리를 봐요</p></div>

<div style="margin-top:30px;display:flex;gap:30px;align-items:baseline">
<div style="flex:none;width:300px;font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1.1;color:#1E2A78">입시 미술</div>
<p class="body" style="font-weight:600">소묘·기초디자인 실기시험 준비<br>가려는 전형이 실기인지부터 봐요</p></div>

<div style="margin-top:30px;display:flex;gap:30px;align-items:baseline">
<div style="flex:none;width:300px;font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1.1;color:#FF5A36">포트폴리오<br>과정</div>
<p class="body" style="font-weight:600">게임·웹툰 쪽 입시와 취업 작품<br>기초에서 작품까지 이어지는지 봐요</p></div>
<p class="small" style="margin-top:auto;padding-bottom:40px">법이 나눈 종류는 아니에요. 배우는 목적에 따라 묶어 봤어요.</p>
