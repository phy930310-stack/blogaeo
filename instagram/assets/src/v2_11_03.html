<body><div class="canvas" style="width:1080px;height:1350px"><div class="in"><div class="top"><span><b>취업</b>&nbsp; 3D 애니메이터, 리깅부터</span><span>3/6</span></div>
<h1 style="margin-top:48px;font-size:88px">리깅이랑 애니메이션,<br>뭐가 다른가요?</h1>

<div style="margin-top:30px;display:flex;gap:30px;align-items:baseline">
<div style="flex:none;width:300px;font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1.1;color:#1E2A78">리깅</div>
<p class="body" style="font-weight:600">모델 안에 뼈대를 넣고 표면을 붙인 뒤<br>움직일 손잡이(컨트롤러)를 다는 일</p></div>

<div style="margin-top:30px;display:flex;gap:30px;align-items:baseline">
<div style="flex:none;width:300px;font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1.1;color:#1E2A78">애니<br>메이션</div>
<p class="body" style="font-weight:600">그 손잡이를 시간 축에서 움직여<br>동작의 타이밍과 무게감을 만드는 일</p></div>
<div style="margin-top:52px;padding-left:28px;border-left:14px solid #FF5A36">
<div style="font-size:60px;font-weight:800;letter-spacing:-2px;line-height:1.15">인형에 관절과 줄을 다는 일,<br>그 인형을 연기시키는 일.</div>
</div>
<p class="body" style="margin-top:48px">캐릭터 하나가 화면에서 움직이기까지는<br>모델링 → 리깅 → 애니메이션 → 엔진 구현<br>네 단계를 거쳐요. 작은 회사는 한 사람이<br>리깅과 애니메이션을 같이 맡기도 해요.</p>
