<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>

<body><div class="canvas" style="width:1080px;height:1350px"><div class="in"><div class="top"><span><b>입시</b>&nbsp; 미술학원, 전형부터 정해요</span><span>5/6</span></div>
<h1 style="margin-top:48px;font-size:88px">상담에 가면<br>이렇게 물어보세요.</h1>

<p style="margin-top:30px;font-size:50px;font-weight:700;letter-spacing:-1.5px;line-height:1.2;color:#FF5A36">포트폴리오 전형에 맞춰 봐 주시나요?</p>

<p style="margin-top:30px;font-size:50px;font-weight:700;letter-spacing:-1.5px;line-height:1.2;color:#1E2A78">수업은 태블릿으로 하나요,<br>손그림으로 하나요?</p>

<p style="margin-top:30px;font-size:50px;font-weight:700;letter-spacing:-1.5px;line-height:1.2;color:#1E2A78">끝나면 작품이 몇 점,<br>어떤 묶음으로 남나요?</p>

<p style="margin-top:30px;font-size:50px;font-weight:700;letter-spacing:-1.5px;line-height:1.2;color:#1E2A78">면접 연습도 같이 하나요?</p>
<p class="body" style="margin-top:48px">여러 학원에 똑같이 묻고<br>답을 나란히 놓아 보세요.</p>
<p class="small" style="margin-top:auto;padding-bottom:40px">질문은 저희가 권하는 거예요.</p>
