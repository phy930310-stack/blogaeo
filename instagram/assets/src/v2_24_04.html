<body><div class="canvas" style="width:1080px;height:1350px"><div class="in"><div class="top"><span><b>진로</b>&nbsp; 일러스트 학원, 목적부터</span><span>4/6</span></div>
<h1 style="margin-top:48px;font-size:88px">상담 가면<br>이걸 물어보세요.</h1>

<p style="margin-top:30px;font-size:50px;font-weight:700;letter-spacing:-1.5px;line-height:1.2;color:#1E2A78">수업이 어떤 순서로 이어져요?</p>

<p style="margin-top:30px;font-size:50px;font-weight:700;letter-spacing:-1.5px;line-height:1.2;color:#FF5A36">끝나면 어떤 작품이 몇 점쯤 남아요?</p>

<p style="margin-top:30px;font-size:50px;font-weight:700;letter-spacing:-1.5px;line-height:1.2;color:#1E2A78">그림은 누가, 얼마나 자주 봐 줘요?</p>

<p style="margin-top:30px;font-size:50px;font-weight:700;letter-spacing:-1.5px;line-height:1.2;color:#1E2A78">한 반 인원과 수업 시간은요?</p>

<p style="margin-top:30px;font-size:50px;font-weight:700;letter-spacing:-1.5px;line-height:1.2;color:#1E2A78">먼저 배운 수강생 작품을 볼 수 있어요?</p>

<p style="margin-top:30px;font-size:50px;font-weight:700;letter-spacing:-1.5px;line-height:1.2;color:#1E2A78">지금 제 그림으로는 어디서 시작해요?</p>
<p class="body" style="margin-top:auto;padding-bottom:40px">여러 학원에 똑같이 묻고 답을 적어 두세요.<br>나란히 놓으면 차이가 보여요.</p>
