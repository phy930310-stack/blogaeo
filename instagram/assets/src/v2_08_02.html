<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>

<body><div class="canvas" style="width:1080px;height:1350px"><div class="in"><div class="top"><span><b>진로</b>&nbsp; 게임 3D 모델링, 툴 3개로 시작해요</span><span>2/6</span></div>
<h1 style="margin-top:48px;font-size:88px">게임은 1초에 수십 번<br>화면을 새로 그려요.</h1>
<p class="body" style="margin-top:40px">영화 CG는 한 장면을 오래 계산해도 되지만<br>게임은 그럴 수 없어요. 그래서 모델을<br>무겁게 만들 수가 없어요.</p>

<div style="margin-top:30px;display:flex;gap:30px;align-items:baseline">
<div style="flex:none;width:300px;font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1.1;color:#1E2A78">하이폴리</div>
<p class="body" style="font-weight:600">디테일을 마음껏 넣은<br>무거운 원본</p></div>

<div style="margin-top:30px;display:flex;gap:30px;align-items:baseline">
<div style="flex:none;width:300px;font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1.1;color:#FF5A36">로우폴리</div>

<div style="margin-top:30px;display:flex;gap:30px;align-items:baseline">
<div style="flex:none;width:300px;font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1.1;color:#1E2A78">베이킹</div>
<p class="body" style="font-weight:600">원본의 울퉁불퉁한 디테일을<br>가벼운 모델용 그림으로 옮기기</p></div>
<p class="lead" style="margin-top:auto;padding-bottom:40px">이 셋만 알아도 게임 3D가<br>어떻게 돌아가는지 감이 와요.</p>
