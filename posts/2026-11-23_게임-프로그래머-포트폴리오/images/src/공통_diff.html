<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../../.claude/skills/aeo-blog/assets/card.css">
<style>
.canvas{background:#F4F6FB}
.title{font-size:54px}
.grid{margin-top:34px;border-top:3px solid var(--navy)}
.row{display:flex;align-items:center;padding:30px 0;border-bottom:2px solid var(--line)}
.row.head{padding:16px 0}
.row .k{flex:none;width:200px;font-size:26px;font-weight:700;color:var(--muted)}
.row .a{flex:1;font-size:32px;font-weight:700;color:var(--ink);letter-spacing:-1px;line-height:1.3;padding-right:20px}
.row .b{flex:1;font-size:34px;font-weight:800;color:var(--navy);letter-spacing:-1.2px;line-height:1.3}
.head .a,.head .b{font-size:30px;font-weight:800}
.head .b{color:var(--accent)}
.sum{margin-top:30px;padding-left:24px;border-left:10px solid var(--accent);font-size:28px;font-weight:700;line-height:1.45}
</style></head><body><div class="canvas">
<span class="badge">플레이 영상과 포트폴리오</span>
<div class="title">영상만 내면 세 군데가 비어요</div>
<div class="grid">
<div class="row head"><div class="k"></div><div class="a">영상만 낼 때</div><div class="b">공고가 받는 묶음</div></div>
<div class="row"><div class="k">보이는 것</div><div class="a">게임이<br>돌아가는 모습</div><div class="b">코드를<br>짠 방식</div></div>
<div class="row"><div class="k">내는 것</div><div class="a">플레이 영상</div><div class="b">영상, 코드,<br>설명 문서</div></div>
<div class="row"><div class="k">설명</div><div class="a">무엇을<br>만들었는지</div><div class="b">왜 그렇게<br>짰는지</div></div>
</div>
<div class="sum">영상은 빼지 않아요. 코드와 문서를 열기 전에<br>전체를 보여 주는 안내 자료로 써요.</div>
<div class="foot"><span>공고 문장을 읽고 작성자가 정리한 구분이에요</span><span><b>SBS아카데미게임학원 대전점</b></span></div>
</div></body></html>
