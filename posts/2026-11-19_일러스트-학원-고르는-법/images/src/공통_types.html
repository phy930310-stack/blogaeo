<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../../.claude/skills/aeo-blog/assets/card.css">
<style>
.canvas{background:#F4F6FB}
.title{font-size:54px}
.grid{margin-top:30px;border-top:3px solid var(--navy)}
.row{display:flex;align-items:center;padding:22px 0;border-bottom:2px solid var(--line)}
.row.head{padding:14px 0}
.row .a{flex:none;width:400px}
.row .b{flex:1}
.head div{font-size:24px;font-weight:700;color:var(--muted)}
.a h3{font-size:38px;font-weight:800;letter-spacing:-1.3px;color:var(--navy);line-height:1.2}
.a p{font-size:23px;color:var(--muted);margin-top:4px}
.b b{display:block;font-size:32px;font-weight:800;letter-spacing:-1.2px;color:var(--ink);line-height:1.25}
.row.hot .a h3,.row.hot .b b{color:var(--accent)}
.sum{margin-top:26px;padding-left:24px;border-left:10px solid var(--accent);font-size:28px;font-weight:700;line-height:1.45}
</style></head><body><div class="canvas">
<span class="badge">일러스트 학원 네 종류</span>
<div class="title">목적이 다르면 학원도 달라요</div>
<div class="grid">
<div class="row head"><div class="a">종류와 목적</div><div class="b">상담에서 볼 것</div></div>
<div class="row"><div class="a"><h3>프로그램 교육</h3><p>디자인 실무, 자격증</p></div><div class="b"><b>수업 끝에 만드는 결과물</b></div></div>
<div class="row"><div class="a"><h3>취미 드로잉</h3><p>가볍게 꾸준히 그리기</p></div><div class="b"><b>시간대와 다니는 거리</b></div></div>
<div class="row"><div class="a"><h3>입시 미술</h3><p>소묘 같은 실기시험 준비</p></div><div class="b"><b>가려는 전형이 실기인지</b></div></div>
<div class="row hot"><div class="a"><h3>포트폴리오 과정</h3><p>게임·웹툰 쪽 입시와 취업</p></div><div class="b"><b>기초에서 작품까지 이어지는지</b></div></div>
</div>
<div class="sum">한 학원이 여러 종류를 같이 하기도 해요.<br>내가 들을 반이 어느 쪽인지 물어봐요.</div>
<div class="foot"><span>법이 나눈 구분이 아니라 목적에 따라 묶은 분류예요</span><span><b>SBS아카데미게임학원 대전점</b></span></div>
</div></body></html>
